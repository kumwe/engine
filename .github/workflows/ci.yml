name: Native quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Declare and publish the next patch even when the current default-branch commit is already released
        type: boolean
        required: false
        default: false
permissions:
  contents: read
# Pull requests replace their in-flight run; default-branch runs are keyed by commit so none is dropped.
concurrency:
  group: native-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  version:
    name: Resolve tested commit and version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
      followup: ${{ steps.resolve.outputs.followup }}
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pull requests that change released source must declare a new version
        if: github.event_name == 'pull_request'
        run: bash tools/version.sh check
      - name: Read the declared version; on the default branch, decide what this run releases
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_ENABLED: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          FORCE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump == true }}
          GIT_AUTHOR_NAME: ${{ vars.KUMWE_RELEASE_AUTHOR_NAME || 'Lemuel' }}
          GIT_AUTHOR_EMAIL: ${{ vars.KUMWE_RELEASE_AUTHOR_EMAIL || 'lemuel@vdm.to' }}
        run: bash tools/version.sh resolve
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: macos-14
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKUMWE_ENGINE_BENCHMARKS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: node tools/check-manifests.mjs build
      - run: bash tools/check-consumer.sh
      - run: build/engine-benchmark > benchmark.jsonl
      - run: node tools/benchmark-metadata.mjs > benchmark-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            benchmark.jsonl
            benchmark-metadata.json
  sanitizers-fuzz:
    needs: version
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKUMWE_ENGINE_SANITIZERS=ON -DKUMWE_ENGINE_FUZZ=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: node tools/fuzz-seeds.mjs
      - run: build/engine-fuzz artifacts/fuzz-seeds -max_total_time=30 -max_len=1048577 -rss_limit_mb=1024 -artifact_prefix=artifacts/fuzz-regressions/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fuzz-regressions-${{ needs.version.outputs.sha }}
          path: |
            artifacts/fuzz-seeds
            artifacts/fuzz-regressions
            build/Testing/Temporary/LastTest.log
  thread-sanitizer:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1:exitcode=97
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Record compiler and configure TSan shadow address range
        run: |
          clang --version
          uname -a
          # Distribution TSan requires this mmap range; ASLR remains enabled.
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Build instrumented Engine and existing concurrent plan test
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread'
          cmake --build build-tsan --target plan-tests --parallel 4
      - name: Execute shared immutable plan under ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure -R '^compiled-plan-ownership$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thread-sanitizer-${{ needs.version.outputs.sha }}
          path: |
            build-tsan/CMakeCache.txt
            build-tsan/Testing/Temporary/LastTest.log
  archive-and-faults:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Build exact archive consumer with networking disabled
        run: sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" -- bash tools/check-archive.sh
      - run: bash tools/check-fault-seeds.sh
      - run: bash tools/test-version.sh
      - name: Assemble and verify the reproducible source release bundle
        run: |
          bash tools/release-bundle.sh "$RUNNER_TEMP/source-release"
          (cd "$RUNNER_TEMP/source-release" && sha256sum --check --strict SHA256SUMS)
          bash tools/release-notes.sh "$RUNNER_TEMP/source-release" > "$RUNNER_TEMP/source-release/RELEASE-NOTES.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-${{ needs.version.outputs.sha }}
          path: ${{ runner.temp }}/source-release
  release:
    name: Publish source release
    needs: [version, native, sanitizers-fuzz, thread-sanitizer, archive-and-faults]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: native-source-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: ${{ vars.KUMWE_RELEASE_AUTHOR_NAME || 'Lemuel' }}
      GIT_AUTHOR_EMAIL: ${{ vars.KUMWE_RELEASE_AUTHOR_EMAIL || 'lemuel@vdm.to' }}
      # The release tooling always comes from the commit that triggered this run; the source being released
      # is checked out separately, because a tag whose release is missing is completed from its own commit.
      KUMWE_ROOT: ${{ github.workspace }}/release-source
    outputs:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
      sha: ${{ needs.version.outputs.sha }}
      archive_sha256: ${{ steps.bundle.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: release-source
          fetch-depth: 0
      - name: Assemble the reproducible source bundle for the tested commit
        id: bundle
        run: |
          bash tools/release-bundle.sh "$RUNNER_TEMP/release"
          test "$(jq -r .version "$RUNNER_TEMP/release/source.json")" = '${{ needs.version.outputs.version }}'
          test "$(jq -r .source.commit "$RUNNER_TEMP/release/source.json")" = '${{ needs.version.outputs.sha }}'
          echo "archive_sha256=$(jq -r .archive.sha256 "$RUNNER_TEMP/release/source.json")" >> "$GITHUB_OUTPUT"
      - name: Attest GitHub OIDC build provenance for the source bundle
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/kumwe-engine-source.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/source.json
            ${{ runner.temp }}/release/source.spdx.json
      - name: Tag the tested commit and publish the immutable release
        run: |
          status=0
          bash tools/release-publish.sh "$RUNNER_TEMP/release" "${{ steps.provenance.outputs.bundle-path }}" || status=$?
          if [ "$status" -eq 3 ]; then
            # Another run published this version first. The current default-branch tip declares the next patch.
            gh workflow run ci.yml --ref '${{ github.event.repository.default_branch }}'
            echo "::notice::Started a new run on ${{ github.event.repository.default_branch }} to release its tip under the next patch version."
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          if [ '${{ needs.version.outputs.followup }}' = 'true' ]; then
            # This run completed an older tag's missing release; the default-branch tip is evaluated afresh,
            # carrying a requested patch bump along.
            if [ '${{ needs.version.outputs.bump }}' = 'true' ]; then
              gh workflow run ci.yml --ref '${{ github.event.repository.default_branch }}' -f bump=true
            else
              gh workflow run ci.yml --ref '${{ github.event.repository.default_branch }}'
            fi
            echo "::notice::Started a follow-up run on ${{ github.event.repository.default_branch }} to evaluate its tip now that ${{ needs.version.outputs.tag }} is published."
          fi
  notify-binding:
    name: Trigger the PHP binding sync
    needs: release
    runs-on: ubuntu-24.04
    env:
      DISPATCH_TOKEN: ${{ secrets.KUMWE_BINDING_DISPATCH_TOKEN }}
    steps:
      - name: Send repository_dispatch engine-release to kumwe/kumwe-engine
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo '::error::Repository secret KUMWE_BINDING_DISPATCH_TOKEN is not set. Create a fine-grained token with Contents: read and write on kumwe/kumwe-engine and add it as that secret; until then the binding picks this release up on its scheduled sync.'
            exit 1
          fi
          payload="$(jq -n \
            --arg version '${{ needs.release.outputs.version }}' \
            --arg tag '${{ needs.release.outputs.tag }}' \
            --arg commit '${{ needs.release.outputs.sha }}' \
            --arg archive_sha256 '${{ needs.release.outputs.archive_sha256 }}' \
            '{event_type: "engine-release", client_payload: {version: $version, tag: $tag, commit: $commit, archive_sha256: $archive_sha256, repository: "kumwe/engine"}}')"
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST repos/kumwe/kumwe-engine/dispatches --input - <<< "$payload"
          echo "Dispatched engine-release ${{ needs.release.outputs.tag }} to kumwe/kumwe-engine"
